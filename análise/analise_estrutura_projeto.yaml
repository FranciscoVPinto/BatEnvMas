      SSR_pct: 52.4
    - posicao: 13
      cenario: pv10_no_battery
      custo_EUR: 2034.9
      SSR_pct: 28.8
    - posicao: 14
      cenario: pv12_nothing  # pior caso
      custo_EUR: 2133.2
      SSR_pct: 25.3

  conclusoes:
    - A exportação vale ~22% de poupança: pv01 (1301€) vs pv05 (1584€) — mesma partilha, sem exportação
    - A bateria vale ~36% de poupança: pv09 (1121€) vs pv10-sem-bateria (2035€)
    - A partilha óptima (pv09) supera a melhor heurística (pv03) em ~2.4%
    - A estratégia consumption_instant é a melhor heurística — aproveita PV quando há consumo
    - Degradação linear λ=0.033 não altera materialmente o custo (pv09 vs pv13 diferem 0.1€)
    - Partilha ponderada (pv02) é a PIOR heurística com exportação — pior até que igual (pv01)


# ═══════════════════════════════════════════════════════════════════════════════
# 🔧 PARÂMETROS BASE (valores reais de _b8_base.yaml)
# ═══════════════════════════════════════════════════════════════════════════════

parametros_base:
  edificio: Building 8
  apartamentos: [Apt1, Apt2, Apt3, Apt4, Apt5, Apt6, Apt7, Apt8]

  bateria:  # Igual para todos os apartamentos (definida como âncora YAML &bat)
    E_init_kWh:   5.0    # SoC inicial (50% de 10 kWh)
    E_min_kWh:    1.0    # SoC mínimo (10%)
    E_max_kWh:    10.0   # Capacidade útil
    P_ch_max_kW:  3.3    # Potência máx carga
    P_dis_max_kW: 3.3    # Potência máx descarga
    eta_ch:       0.95   # Eficiência de carga (95%)
    eta_dis:      0.95   # Eficiência de descarga (95%)
    P_grid_max_kW: 13.8  # Limite de ligação à rede por apartamento

  tarifa_flat:  # Definida em _b8_base.yaml (pode ser sobreposta por cenário)
    grid_buy_eur_per_kwh:  0.27  # Tarifa de compra da rede
    grid_sell_eur_per_kwh: 0.06  # Tarifa de venda (feed-in)

  pv:
    ficheiros: [data/pv_gen_01.csv … data/pv_gen_08.csv]
    nota: 8 geradores PV (um por painel/fracção), somados para PV_total em modo óptimo
    total_anual_estimado_kWh: 12572.97  # (do meta.yaml do pv09 1year)

  carga:
    ficheiros: [data/load_cons_09.csv (Apt1), data/load_cons_02.csv (Apt2), …]
    nota: Apt1 usa load_cons_09 (não load_cons_01) — numeração histórica do edifício

  resolucao_temporal:
    dt_nativo_h: 0.25     # 15 minutos (todos os CSVs)
    dt_pwl_h:    1.0      # 1 hora (cenários PWL — resampling automático em run_case.py)

  solver:
    nome: HiGHS (appsi_highs via highspy, fallback: highs via CLI)
    mip_rel_gap: 0.005    # 0.5%
    time_limit_full_horizon_s: 14400.0   # 4 horas
    time_limit_pwl_s:           3600.0   # 1 hora (por casa, cenários PWL)
    time_limit_alfa_deg_s:      1800.0   # 30 minutos


# ═══════════════════════════════════════════════════════════════════════════════
# 🔁 SWEEPS CONFIGURADOS
# ═══════════════════════════════════════════════════════════════════════════════

sweeps:

  full_horizon_sweep:
    ficheiro: cases/runsets/runset_full_horizon_sweep.yaml
    casos_base: pv01..pv14  # 14 cenários (excl. PWL)
    entradas:
      - suffix: 1month  | horizon: 2880  | dt: 0.25h | total_h:  720
      - suffix: 3months | horizon: 8640  | dt: 0.25h | total_h: 2160
      - suffix: 6months | horizon: 17280 | dt: 0.25h | total_h: 4320
      - suffix: 1year   | horizon: 35040 | dt: 0.25h | total_h: 8760
    total_runs: 56  # 14 casos × 4 horizontes

  pwl_sweep:
    ficheiro: cases/runsets/runset_pwl_sweep.yaml
    casos_base: pv15..pv19  # 5 cenários PWL
    entradas:
      - suffix: 1month  | horizon: 720  | dt: 1.0h
      - suffix: 3months | horizon: 2160 | dt: 1.0h
      - suffix: 6months | horizon: 4320 | dt: 1.0h
    nota: 1 ano não incluído — custo computacional elevado mesmo com dt=1h e per-house decomposition
    total_runs: 15  # 5 casos × 3 horizontes

  alfa_deg_sweep:
    ficheiro: cases/runsets/runset_alfa_deg_sweep.yaml
    casos_base: [pv01, pv02, pv03, pv04, pv09]
    entradas:
      - suffix: no_deg   | override: battery_degradation_eur_per_kwh=0.0
      - suffix: with_deg | override: battery_degradation_eur_per_kwh=0.033
    horizonte_padrao: 2688 timesteps (28 dias a 15min)
    total_runs: 10  # 5 casos × 2 variantes
