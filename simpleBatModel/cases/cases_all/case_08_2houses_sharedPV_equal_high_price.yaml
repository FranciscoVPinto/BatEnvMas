case: case_08_2houses_sharedPV_equal_high_price

time:
  dt_hours: 1
  horizon: 500

data:
  pv_total: data/pv_gen.csv
  loads:
    A: data/load_cons.csv
    B: data/load_cons.csv

sharing:
  mode: fixed_alpha
  alpha:
    A: 0.5
    B: 0.5
  normalize: false
  strict_sum_to_one: true

tariffs:
  grid_buy: 0.40
  grid_sell: 0.03

solver:
  name: highs
  options: {}

houses:
  A:
    battery:
      E_init: 2.0
      E_min: 0.5
      E_max: 5.0
      P_ch_max: 2.0
      P_dis_max: 2.0
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 10.0
  B:
    battery:
      E_init: 1.0
      E_min: 0.2
      E_max: 3.0
      P_ch_max: 1.5
      P_dis_max: 1.5
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 10.0
