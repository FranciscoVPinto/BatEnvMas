    battery:
      E_init: 2.0
      E_min: 0.5
      E_max: 5.0
      P_ch_max: 2.0
      P_dis_max: 2.0
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 10.0
  B:
    battery:
      E_init: 1.0
      E_min: 0.2
      E_max: 3.0
      P_ch_max: 1.5
      P_dis_max: 1.5
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 10.0
