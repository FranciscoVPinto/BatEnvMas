# cases/default_case.yaml
# -------------------------------------------------------------------
# DEFAULT / TEMPLATE CASE FILE
#
# This YAML defines ONE simulation/optimization "case".
# Your runner (scripts/run_case.py) reads this file and:
#   - loads input time series (PV + loads)
#   - builds one MILP per house (battery scheduling)
#   - solves each house independently
#   - writes results to: results/<case_name>/results_house_<id>.csv
#
# Important idea:
#   - Each house runs its own MILP.
#   - If PV is "shared", we do NOT change the MILP.
#     Instead, we PRE-COMPUTE the PV allocated to each house
#     (using alpha rules), and then feed PV_i(t) to each house.
# -------------------------------------------------------------------

case: default_case
# A human-readable name for this case.
# This is also used as the output folder name:
#   results/default_case/

time:
  dt_hours: 1
  # Time step in hours.
  # dt_hours = 1 means each step is 1 hour.
  # If you use 0.25, each step is 15 minutes.

  horizon: 500
  # Number of time steps to simulate/optimize.
  # The scripts will read the first "horizon" samples from each CSV.

data:
  # ------------------------------------------------------------
  # INPUT DATA FILES
  #
  # You must choose ONE PV mode:
  #
  #   A) Per-house PV (legacy):
  #       Use 'pv' and do NOT use 'pv_total'
  #
  #   B) Shared PV (new):
  #       Use 'pv_total' and configure 'sharing'
  #       (Do NOT use 'pv' at the same time)
  #
  # All CSV time series are expected to be:
  #   - 1 column
  #   - no header
  #   - values are numeric
  # ------------------------------------------------------------

  # ----------------------------
  # PV MODE A: Per-house PV
  # ----------------------------
  pv: data/pv_gen.csv
  # If pv is a STRING, it means: "all houses use the same PV profile".
  # Example: each house is modelled as having its own PV that follows
  # the same production curve.
  #
  # Alternative (uncomment) for per-house PV with different files:
  # pv:
  #   A: data/pv_A.csv
  #   B: data/pv_B.csv
  # If pv is a DICT, each house gets its own PV file.

  # ----------------------------
  # PV MODE B: Shared PV total
  # ----------------------------
  # pv_total: data/pv_gen.csv
  # If you uncomment pv_total, you are saying:
  #   "There is one PV plant for the whole community."
  # Then the PV each house receives is computed via sharing rules:
  #   PV_i(t) = alpha_i(t) * PV_total(t)
  #
  # IMPORTANT:
  #   Do NOT define both 'pv' and 'pv_total' at the same time.

  # ----------------------------
  # LOADS (consumption) per house
  # ----------------------------
  loads:
    A: data/load_cons.csv
    B: data/load_cons.csv
  # Loads must be a dict mapping each house ID to a CSV path.
  # House IDs here must match the keys under 'houses:' below.
  #
  # Tip:
  #   If you use the same load file for A and B, then A and B will
  #   behave similarly (except for different battery sizes).
  #   If you want different behavior, provide different files.

tariffs:
  # ------------------------------------------------------------
  # ECONOMIC PARAMETERS (grid prices)
  #
  # grid_buy: price paid when importing from the grid  [€/kWh]
  # grid_sell: revenue when exporting to the grid      [€/kWh]
  #
  # You can provide a scalar (constant price),
  # or a list/array with length >= horizon (time-varying price).
  # ------------------------------------------------------------
  grid_buy: 0.25
  grid_sell: 0.05

solver:
  # ------------------------------------------------------------
  # SOLVER SETTINGS
  #
  # name: MILP solver name used by your solve_model() wrapper.
  # options: solver-specific options (time limits, mip gap, etc.)
  # ------------------------------------------------------------
  name: highs
  options: {}
  # Example:
  # options:
  #   time_limit: 30

sharing:
  # ------------------------------------------------------------
  # SHARED PV ALLOCATION RULES
  #
  # This section is ONLY used if you use:
  #   data.pv_total
  #
  # If you use data.pv (per-house PV), this section is ignored.
  # ------------------------------------------------------------
  mode: fixed_alpha
  # Current supported mode: fixed_alpha
  # Meaning:
  #   PV_i(t) = alpha_i(t) * PV_total(t)
  # where alpha_i(t) is given by the user OR computed by fallback rules.

  # ----------------------------
  # Choose ONE alpha definition:
  # ----------------------------

  # 1) Scalar alpha per house (constant over time):
  alpha:
    A: 0.6
    B: 0.4
  # These should normally sum to 1.0.
  # A gets 60% of PV_total each time step, B gets 40%.

  # 2) Time-varying alpha profile per house:
  # alpha_profile:
  #   A: data/alpha_A.csv
  #   B: data/alpha_B.csv
  # Each alpha CSV is 1-column, length >= horizon.
  # This lets alphas change over time (e.g., 15-min coefficients).

  normalize: false
  # If normalize = true:
  #   At each time step, alphas are normalized so sum(alpha)=1.
  # Useful if the provided alphas do not sum to 1.
  #
  # If normalize = false:
  #   The code uses alphas as provided.
  #   If sum(alpha) != 1 and strict_sum_to_one=false,
  #   it proceeds but logs a warning.

  strict_sum_to_one: false
  # If strict_sum_to_one = true:
  #   The code raises an error when sum(alpha)!=1
  #   (or for profiles, when at any t: sum(alpha(t))!=1)
  #
  # If strict_sum_to_one = false:
  #   The code allows sums != 1 (warning) or can normalize if enabled.

  fallback:
    # ------------------------------------------------------------
    # FALLBACK alpha computation (optional safety net)
    #
    # Used only in shared PV mode (pv_total).
    #
    # This is useful if:
    #   - alpha is missing for some house
    #   - alpha has invalid values (negative)
    #   - strict_sum_to_one is true and alpha sums are wrong
    #
    # Fallback computes alpha from the LOADS.
    # ------------------------------------------------------------

    mode: none
    # fallback.mode options:
    #   - none:
    #       Never compute alpha from consumption.
    #       If alpha inputs are missing/invalid -> error.
    #
    #   - consumption_instant:
    #       alpha_i(t) = Load_i(t) / sum_j Load_j(t)
    #       (dynamic, changes every time step)
    #
    #   - consumption_mean:
    #       alpha_i = mean(Load_i) / sum_j mean(Load_j)
    #       (constant over time; uses average load over the horizon)

    apply_when: invalid_or_missing
    # apply_when options:
    #   - invalid_or_missing:
    #       Use fallback ONLY if alpha/alpha_profile are missing or invalid:
    #         * missing alpha for some house
    #         * negative alpha values
    #         * strict_sum_to_one=true and sums are not 1
    #
    #       IMPORTANT:
    #       If strict_sum_to_one=false and sum(alpha)!=1:
    #         - fallback does NOT trigger automatically
    #         - if normalize=true, alphas are normalized
    #         - else it continues with a warning
    #
    #   - always:
    #       Ignore alpha/alpha_profile completely, even if valid,
    #       and always compute alpha using fallback.mode.

houses:
  # ------------------------------------------------------------
  # HOUSE PARAMETERS
  #
  # Each key here is a "house_id". These IDs must match:
  #   - data.loads keys
  #   - sharing.alpha (or alpha_profile) keys in shared PV mode
  #
  # Each house has a battery model with:
  #   E_* : energy state [kWh]
  #   P_* : power limits [kW]
  #   eta : efficiencies [-]
  # ------------------------------------------------------------

  A:
    battery:
      E_init: 2.0
      # Initial energy in the battery at t=0 [kWh]

      E_min: 0.5
      # Minimum allowed battery energy [kWh]

      E_max: 5.0
      # Maximum allowed battery energy [kWh]

      P_ch_max: 2.0
      # Maximum charging power [kW]

      P_dis_max: 2.0
      # Maximum discharging power [kW]

      eta_ch: 0.95
      # Charging efficiency (0..1)

      eta_dis: 0.95
      # Discharging efficiency (0..1)

      P_grid_max: 10.0
      # Maximum import/export power to the grid [kW]
      # (depends on contracted power / inverter limits)

  B:
    battery:
      E_init: 1.0
      E_min: 0.2
      E_max: 3.0
      P_ch_max: 1.5
      P_dis_max: 1.5
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 10.0
