runset:
  - runsets/runset_alfa_deg_sweep.yaml
  - runsets/runset_full_horizon_sweep.yaml
  - runsets/runset_pwl_sweep.yaml

enabled:
  alfa_deg_sweep: true
  full_horizon_sweep: true
  pwl_sweep: true

defaults:
  outputs_dir: results
  tee: true
  solver:
    name: appsi_highs
    options: {}
  time:
    horizon: 2688
    dt_hours: 0.25
    start: 2025-01-01 00:00
