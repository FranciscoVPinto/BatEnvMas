runset: pwl_sweep
cases_base_dir: cases/scenarios/building8
cases_glob:
  - "b8_pv15*.yaml"
  - "b8_pv16*.yaml"
  - "b8_pv17*.yaml"
  - "b8_pv18*.yaml"
  - "b8_pv19*.yaml"

# PWL degradation models at native 15-min resolution (dt_hours: 0.25).
# No resampling is applied. Horizons match the full_horizon_sweep non-PWL cases.
sweep:
  - suffix: 1month
    outputs_subdir: 1month
    time_override: { horizon: 2880, dt_hours: 0.25 }
  - suffix: 3months
    outputs_subdir: 3months
    time_override: { horizon: 8640, dt_hours: 0.25 }
  # Horizontes longos: rolling horizon (aproximado) para o MILP fechar em tempo util.
  # 1month/3months ficam exatos (baseline para validar o desvio da aproximacao).
  - suffix: 6months
    outputs_subdir: 6months
    time_override: { horizon: 17280, dt_hours: 0.25 }
    overrides:
      model:
        rolling_horizon: { enabled: true, window: 1344, step: 672 }
  - suffix: 1year
    outputs_subdir: 1year
    time_override: { horizon: 35040, dt_hours: 0.25 }
    overrides:
      model:
        rolling_horizon: { enabled: true, window: 1344, step: 672 }

defaults:
  outputs_dir: results/full_horizon_sweep
  tee: false
  solver:
    name: appsi_highs
    options:
      mip_rel_gap: 0.005
      time_limit: 3600.0
      mip_heuristic_effort: 1.0
