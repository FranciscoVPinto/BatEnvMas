# _b8_base.yaml — Configuração base do Edifício 8
# =====================================================
# Todos os cenários específicos (b8_pv01_*.yaml … b8_pv19_*.yaml) herdam
# deste ficheiro via "extends: _b8_base.yaml" e sobrepõem apenas o que difere.

# ── Horizonte temporal ──────────────────────────────────────────────────────
time:
  dt_hours: 0.25
  start: "2025-01-01 00:00"

# ── Dados de entrada ─────────────────────────────────────────────────────────
data:
  pv_total:
    - data/pv_gen_01.csv
    - data/pv_gen_02.csv
    - data/pv_gen_03.csv
    - data/pv_gen_04.csv
    - data/pv_gen_05.csv
    - data/pv_gen_06.csv
    - data/pv_gen_07.csv
    - data/pv_gen_08.csv
  loads:
    Apt1: data/load_cons_01.csv
    Apt2: data/load_cons_02.csv
    Apt3: data/load_cons_03.csv
    Apt4: data/load_cons_04.csv
    Apt5: data/load_cons_05.csv
    Apt6: data/load_cons_06.csv
    Apt7: data/load_cons_07.csv
    Apt8: data/load_cons_08.csv

# ── Tarifas ──────────────────────────────────────────────────────────────────
# Tarifa bi-horária (ciclo diário ERSE) — EDP Eletricidade Verde, c/ IVA 23%
# Fonte: lojaluz.com, maio 2026
# Fora de vazio (08:00–22:00): 0.1916 × 1.23 ≈ 0.24 €/kWh
# Vazio       (22:00–08:00): 0.1108 × 1.23 ≈ 0.14 €/kWh
tariffs:
  model: bi_horaria
  grid_buy:
    peak: 0.24
    offpeak: 0.14
    peak_periods:
      - ["08:00", "22:00"]
  grid_sell: 0.06

# ── Rede ─────────────────────────────────────────────────────────────────────
grid:
  allow_export: true

# ── Modelo ───────────────────────────────────────────────────────────────────
model:
  cyclic_soc: true

# ── Casas e baterias ─────────────────────────────────────────────────────────
# P_contracted = menor escalão oficial de potência contratada em PT
#                 que é >= ao máximo observado no respetivo load_cons_XX.csv.
