extends: _b8_base.yaml
case: b8_pv02_weighted_export

grid:
  allow_export: true

# Distribuição fixa com pesos arbitrários (ex: acordada em assembleia de condóminos).
# Apt1 e Apt2 recebem quota maior por terem maior área/consumo contratado.
# Para pesos proporcionais ao consumo médio real, ver pv04 (consumption_mean).
sharing:
  mode: fixed_alpha
  normalize: false
  strict_sum_to_one: true
  alpha:
    Apt1: 0.25
    Apt2: 0.15
    Apt3: 0.10
    Apt4: 0.10
    Apt5: 0.10
    Apt6: 0.10
    Apt7: 0.10
    Apt8: 0.10
