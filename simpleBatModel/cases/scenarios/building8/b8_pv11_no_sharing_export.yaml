extends: _b8_base.yaml
case: b8_pv11_no_sharing_export

# Referência "sem comunidade": cada apartamento usa apenas o seu próprio PV.
# pv_total do base é anulado; cada casa recebe o seu gerador individual.
data:
  pv_total: ~
  pv:
    Apt1: data/pv_gen_01.csv
    Apt2: data/pv_gen_02.csv
    Apt3: data/pv_gen_03.csv
    Apt4: data/pv_gen_04.csv
    Apt5: data/pv_gen_05.csv
    Apt6: data/pv_gen_06.csv
    Apt7: data/pv_gen_07.csv
    Apt8: data/pv_gen_08.csv

grid:
  allow_export: true

# Bateria genérica igual para todos — isola o efeito da partilha, não do dimensionamento.
houses:
  Apt1: { battery: &bat
    { E_init: 5.0, E_min: 1.0, E_max: 10.0,
      P_ch_max: 3.3, P_dis_max: 3.3,
      eta_ch: 0.95, eta_dis: 0.95,
      P_contracted: 3.45 } }
  Apt2: { battery: *bat }
  Apt3: { battery: *bat }
  Apt4: { battery: *bat }
  Apt5: { battery: *bat }
  Apt6: { battery: *bat }
  Apt7: { battery: *bat }
  Apt8: { battery: *bat }
