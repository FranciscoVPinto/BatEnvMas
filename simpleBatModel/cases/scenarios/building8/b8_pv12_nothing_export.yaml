extends: _b8_base.yaml
case: b8_pv12_nothing_export

# Baseline absoluto: sem bateria, sem partilha de PV — cada apartamento usa só o seu.
# pv_total do base é anulado; cada casa recebe o seu gerador individual.
data:
  pv_total: ~
  pv:
    Apt1: data/pv_gen_01.csv
    Apt2: data/pv_gen_02.csv
    Apt3: data/pv_gen_03.csv
    Apt4: data/pv_gen_04.csv
    Apt5: data/pv_gen_05.csv
    Apt6: data/pv_gen_06.csv
    Apt7: data/pv_gen_07.csv
    Apt8: data/pv_gen_08.csv

grid:
  allow_export: true

# P_contracted por apartamento igual ao do base — sem bateria a restrição de import
# é vinculativa se o pico de carga exceder o escalão contratado.
# Apt5 tem pico 2.301 kW; P_contracted=2.30 causaria infeasibilidade marginal.
houses:
  Apt1: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 2.30 } }
  Apt2: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 2.30 } }
  Apt3: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 1.15 } }
  Apt4: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 2.30 } }
  Apt5: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 3.45 } }
  Apt6: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 1.15 } }
  Apt7: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 2.30 } }
  Apt8: { battery: { E_init: 0, E_min: 0, E_max: 0, P_ch_max: 0, P_dis_max: 0, eta_ch: 0.95, eta_dis: 0.95, P_contracted: 1.15 } }
