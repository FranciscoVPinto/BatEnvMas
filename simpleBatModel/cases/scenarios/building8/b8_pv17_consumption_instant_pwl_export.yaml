extends: _b8_base.yaml
case: b8_pv17_consumption_instant_pwl_export

grid:
  allow_export: true

sharing:
  mode: fixed_alpha
  normalize: false
  strict_sum_to_one: false
  fallback:
    mode: consumption_instant
    apply_when: always
    zero_denom: equal_split

model:
  cyclic_soc: true
  battery_degradation_pwl:
    soc_breakpoints: [0.0, 0.2, 0.8, 1.0]
    lambda_by_bin: [0.08, 0.03, 0.06]
