data:
  pv_total:
  - data/pv_gen_01.csv
  - data/pv_gen_02.csv
  - data/pv_gen_03.csv
  - data/pv_gen_04.csv
  - data/pv_gen_05.csv
  - data/pv_gen_06.csv
  - data/pv_gen_07.csv
  - data/pv_gen_08.csv
  loads:
    Apt1: data/load_cons_09.csv
    Apt2: data/load_cons_02.csv
    Apt3: data/load_cons_03.csv
    Apt4: data/load_cons_04.csv
    Apt5: data/load_cons_05.csv
    Apt6: data/load_cons_06.csv
    Apt7: data/load_cons_07.csv
    Apt8: data/load_cons_08.csv
tariffs:
  grid_buy: 0.27
  grid_sell: 0.06
houses:
  Apt1:
    battery: &id001
      E_init: 5.0
      E_min: 1.0
      E_max: 10.0
      P_ch_max: 3.3
      P_dis_max: 3.3
      eta_ch: 0.95
      eta_dis: 0.95
      P_grid_max: 13.8
  Apt2:
    battery: *id001
  Apt3:
    battery: *id001
  Apt4:
    battery: *id001
  Apt5:
    battery: *id001
  Apt6:
    battery: *id001
  Apt7:
    battery: *id001
  Apt8:
    battery: *id001
case: b8_pv18_consumption_mean_pwl_export__6months
grid:
  allow_export: true
sharing:
  mode: fixed_alpha
  normalize: false
  strict_sum_to_one: false
  fallback:
    mode: consumption_mean
    apply_when: always
model:
  cyclic_soc: true
  battery_degradation_pwl:
    soc_breakpoints:
    - 0.0
    - 0.2
    - 0.8
    - 1.0
    lambda_by_bin:
    - 0.08
    - 0.03
    - 0.06
